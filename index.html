<!doctype html>
<html lang="pt-MZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECHpro – Contabilidade e Gestão de RH Integrada</title>
    <meta name="description" content="Sistema integrado de contabilidade e recursos humanos com automação de folha de pagamento, gestão de férias e benefícios, conformidade eSocial, integração bancária em tempo real, relatórios fiscais e auditoria." />
    <meta property="og:title" content="ECHpro – Contabilidade e Gestão de RH Integrada" />
    <meta property="og:description" content="Sistema integrado de contabilidade e recursos humanos com automação de folha de pagamento, gestão de férias e benefícios, conformidade eSocial, integração bancária em tempo real, relatórios fiscais e auditoria." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#b91c1c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ECHpro ERP" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => {
              console.log('[ECHpro PWA] Service Worker registrado com sucesso (Offline-First ativo):', reg.scope);
            })
            .catch((err) => {
              console.warn('[ECHpro PWA] Falha ao registrar Service Worker:', err);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
